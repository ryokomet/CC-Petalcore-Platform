<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petalcore</title>
    <style>
        body { margin: 0; padding: 4rem 1.5rem; background: #EDEEE1; color: #1F2E1C; font: 1rem/1.5 Arial, sans-serif; }
        main { max-width: 760px; margin: auto; }
        h1 { font: 600 3rem Georgia, serif; margin: 0 0 0.5rem; }
        p { color: #5C6B57; }
        nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-top: 2rem; }
        a { display: block; padding: 1.5rem; border: 1px solid #DAD7C2; border-radius: 8px; background: #FBFAF2; color: #2F5233; font-weight: 700; text-decoration: none; }
        a:hover { border-color: #9C5216; }
    </style>
</head>
<body>
    <main>
        <h1>Petalcore</h1>
        <p>Explore plants, identify a photo, or find the right plant for your space.</p>
        <nav aria-label="Petalcore apps">
            <a href="/index/">Petalcore Index</a>
            <a href="/id/">Petalcore ID</a>
            <a href="/select/">Petalcore Select</a>
        </nav>
    </main>
</body>
</html>
